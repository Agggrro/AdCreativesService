# The gates CLAUDE.md lists, run automatically instead of from memory.
#
# The nightly job exists for one specific reason: since ADR-0015 the entitlement
# predicate has two implementations — `private.is_entitled` in Postgres and
# `lib/serving/entitlement.ts` — and a drift between them either darks a live tag
# or tells a buyer their dead tag is fine. `check:entitlement` compares Postgres's
# own verdict against the TypeScript port, so it needs a real database and cannot
# run on a pull request from a fork.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"

# A newer push makes an in-flight pull-request run irrelevant. Not one on main:
# cancelling that run would cancel its deploy job mid-flight whatever the job's
# own concurrency says, so runs on main queue instead.
# The event is part of the group, so the 03:00 nightly can never cancel a
# queued push run — and with it that push's Worker deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read the repository, nothing else. The deploy authenticates to Cloudflare with
# its own secret, not with the workflow token.
permissions:
  contents: read

jobs:
  checks:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 for native TypeScript type stripping: `npm run test:entitlement`
          # runs `node --test` directly against a .ts file, with no build step.
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # Every suite runs here, none needs a secret. test:vast and test:cors pin
      # the bytes and headers the ad path emits, which since ADR-0029 two
      # runtimes serve from the same modules.
      - run: npm run test:entitlement
      - run: npm run test:vast
      - run: npm run test:ads
      - run: npm run test:cors
      - run: npm run test:snapshots
      - run: npm run test:media
      - run: npm run test:postback

      # The ad Worker bundles: an import that only resolves under Next (or not
      # at all in a Worker) fails here, before the deploy job, not in production.
      - run: npx wrangler deploy -c workers/ads/wrangler.jsonc --dry-run --outdir /tmp/ads-dry-run

      # No secrets: app/sitemap.ts returns its static pages when the Supabase
      # env vars are absent, so a build with none is a real build.
      - run: npm run build

  # The ad domain (ADR-0029). A push to main is production for the Worker as it
  # is for the app, and only after every gate above has passed. Secrets live in
  # the Worker (`wrangler secret put`), never here; this token can deploy
  # Workers and edit the two zones' routes and DNS, nothing else.
  deploy-ads:
    name: deploy the ad Worker
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never cancelled mid-deploy by a newer push; the newer run deploys after.
    concurrency:
      group: deploy-ads
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4e9bc9b3bf84f2a176586ef8dad3b43c
        run: npx wrangler deploy -c workers/ads/wrangler.jsonc

  drift:
    name: nightly drift checks
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      # The validator's hop tokens are HMAC-signed; any value works for a
      # fixture run, it just has to exist.
      PREVIEW_TOKEN_SECRET: ci-fixture-run-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run build

      # check:vast drives the real routes over HTTP, so it needs the app up.
      - name: Start the app
        run: |
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/api/vast?creative_id=x; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not come up in 60s"; exit 1

      - name: VAST fixture corpus
        run: npm run check:vast

      # Skipped rather than failed when the secret is absent: a permanently red
      # nightly is a nightly nobody reads.
      - name: Entitlement predicate vs Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set — skipping the SQL/TypeScript entitlement comparison."
            echo "Add it under Settings -> Secrets and variables -> Actions to enable this check."
            exit 0
          fi
          npm run check:entitlement
