<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='ad.size' content='width=300,height=250'>
<style>
html,body{margin:0;width:300px;height:250px;overflow:hidden;background:#0f172a;font-family:Arial,Helvetica,sans-serif;color:#fff}
#ad{position:relative;width:300px;height:250px;cursor:pointer}
.glow{position:absolute;left:20px;top:-20px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#f59e0b 0%,rgba(245,158,11,0) 65%);opacity:.5;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.4}50%{transform:scale(1.05);opacity:.65}}
.eyebrow{position:absolute;left:20px;top:26px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
h1{position:absolute;left:20px;top:48px;margin:0;width:260px;font-size:28px;line-height:1.1;font-weight:700}
p{position:absolute;left:20px;top:126px;margin:0;width:240px;font-size:14px;line-height:1.4;opacity:.85}
.cta{position:absolute;left:20px;bottom:24px;padding:10px 18px;border-radius:6px;background:#f59e0b;color:#0f172a;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id='ad'>
<div class='glow'></div>
<div class='eyebrow'>Sample HTML5 banner</div>
<h1>Your creative, in the player</h1>
<p>Replace this HTML with your own banner. Keep clickTag for the click.</p>
<div class='cta'>Learn more</div>
</div>
<script>
document.getElementById('ad').addEventListener('click',function(){window.open(clickTag,'_blank');});
</script>
</body>
</html>
